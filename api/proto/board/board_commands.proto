// Flips one or more board items to the opposite side of the board.  Returns FlipItemsResponse.
message FlipItems
{
  kiapi.common.types.ItemHeader header = 1;

  repeated kiapi.common.types.KIID items = 2;

  // Direction to flip the items; BFD_TOP_BOTTOM if unspecified.
  BoardFlipDirection direction = 3;
}

message ItemFlipResult
{
  kiapi.common.commands.ItemStatus status = 1;

  // Updated version of the item after the flip (only populated when status.status is ISC_OK)
  google.protobuf.Any item = 2;
}

message FlipItemsResponse
{
  kiapi.common.types.ItemHeader header = 1;

  // Status of the overall request; may return IRS_OK even if no items were flipped
  kiapi.common.types.ItemRequestStatus status = 2;

  repeated ItemFlipResult flipped_items = 3;
}


//// Interactive commands ////
// These commands begin an interactive operation in the editor.
// They return a response immediately, but the editor will become busy
// and will not reply to further API commands until the user has finished
// the operation.
// These commands will return an error if received in a non-interactive context.

// Selects and begins an interactive move of the given item(s).
// NOTE: Takes ownership of the active commit, if one exists:
//       the move tool will push the commit when the user confirms the move,
//       or roll back the commit if the user cancels the move.  Keep this in
//       mind if using this command in combination with commands that create
//       or modify items using an explicit commit.
message InteractiveMoveItems
{
  kiapi.common.types.DocumentSpecifier board = 1;

  repeated kiapi.common.types.KIID items = 2;
}


// A single board item implicated in a DRC violation.
message DrcAffectedItem
{
  kiapi.common.types.KIID id = 1;

  // Human-readable description, e.g. "Pad 1 [GND] of R5"
  string description = 2;

  // Position in the units requested by RunDrc
  kiapi.common.types.Vector2 position = 3;
}

// One DRC finding.
message DrcViolation
{
  // Machine-readable check key, e.g. "clearance", "unconnected_items".
  // Matches the settings key used in the board's DRC severity configuration.
  string type = 1;

  string description = 2;

  kiapi.common.types.RuleSeverity severity = 3;

  repeated DrcAffectedItem items = 4;

  // True when the violation is excluded in the board's exclusion list. Excluded
  // violations are only returned when RS_EXCLUSION is among the requested
  // severities.
  bool excluded = 5;

  // Exclusion rationale; only meaningful when excluded is true.
  string exclusion_comment = 6;
}

// A check that is disabled in the board's DRC severity configuration, and so was
// not run. Reported so that callers can tell "no violations" apart from
// "not checked".
message DrcIgnoredCheck
{
  string key = 1;
  string description = 2;
}

// Runs the design rule checker over a board and returns the violations found.
//
// This does not modify the board on disk. It does replace the board's DRC
// markers in memory, exactly as the DRC dialog and `kicad-cli pcb drc` do.
//
// Returns RunDrcResponse.
message RunDrc
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // Units used for the coordinates in the response. Defaults to millimeters.
  kiapi.common.types.Units units = 2;

  // Report every track error rather than only the first per track. Slower.
  bool report_all_track_errors = 3;

  // Also test parity between the board and its schematic. Requires a fully
  // annotated schematic; the schematic is loaded from the project if no
  // schematic editor is open.
  bool check_schematic_parity = 4;

  // Refill zones before checking. Stale zone fills produce spurious unconnected
  // items, so this defaults to true when unset (see refill_zones_set).
  bool refill_zones = 5;

  // Distinguishes "refill_zones was explicitly set to false" from "not set",
  // since proto3 scalars have no presence. When false, refill_zones is ignored
  // and zones are refilled.
  bool refill_zones_set = 6;

  // Severities to include. When empty, errors and warnings are reported and
  // exclusions are omitted.
  repeated kiapi.common.types.RuleSeverity severities = 7;
}

message RunDrcResponse
{
  // Design rule violations.
  repeated DrcViolation violations = 1;

  // Unrouted connections. Reported separately from violations because they mean
  // something different: routing is incomplete rather than incorrect. Note that
  // KiCad assigns these RS_ERROR severity, so callers that bucket by severity
  // alone will double-count them.
  repeated DrcViolation unconnected_items = 2;

  // Board/schematic mismatches. Empty unless check_schematic_parity was set.
  // Also RS_ERROR severity; the same double-counting caveat applies.
  repeated DrcViolation schematic_parity = 3;

  // Checks that were disabled and therefore not run.
  repeated DrcIgnoredCheck ignored_checks = 4;

  // Units the coordinates in this response are expressed in.
  kiapi.common.types.Units units = 5;

  // The severities actually included, after defaults were applied.
  repeated kiapi.common.types.RuleSeverity included_severities = 6;
}


enum AutoplaceResult
{
  APR_UNKNOWN = 0;
  APR_COMPLETED = 1;
  APR_CANCELLED = 2;
  APR_FAILURE = 3;
}

// Automatically position footprints, minimising ratsnest length while keeping
// courtyards clear.
//
// Wraps AR_AUTOPLACER, which KiCad exposes only as an interactive tool. Placement
// dominates whether a dense interface can be routed at all, so an agent needs it
// before routing rather than after.
//
// The board is modified in place; nothing is written to disk. Returns
// AutoplaceFootprintsResponse.
message AutoplaceFootprints
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // Footprints to place. When empty, every footprint on the board is placed.
  repeated kiapi.common.types.KIID footprints = 2;

  // Also place footprints that currently sit outside the board outline. Off by
  // default: it moves parts a caller did not name.
  bool place_offboard = 3;

  // Move locked footprints too. AR_AUTOPLACER itself has no lock awareness --
  // AUTOPLACE_TOOL filters locked footprints before calling it -- so without this
  // the handler does that filtering, matching the editor's default.
  bool override_locks = 4;
}

message AutoplaceFootprintsResponse
{
  AutoplaceResult result = 1;

  // Footprints whose position or orientation actually changed.
  repeated kiapi.common.types.KIID moved = 2;

  // 3 and 4 held ratsnest length before/after. See documentation/03-gaps.md: the
  // airline length could not be made to reflect footprint moves made earlier in the
  // same session, so reporting it would have meant presenting a stale number as the
  // objective autoplacement minimises. Reserved so they can come back unchanged.
  reserved 3, 4;

  // Footprints left alone because they are locked and override_locks was not set.
  // Reported so a caller that named a footprint explicitly can tell "placed it" from
  // "declined to move it" rather than reading a silent success.
  repeated kiapi.common.types.KIID skipped_locked = 5;
}


// Search the configured footprint libraries.
//
// Answers the question an agent has to resolve before it can place anything:
// "what parts are available, and what is the LIB_ID for one?". Backed by
// FOOTPRINT_LIST, the same index KiCad's own footprint chooser uses, so results
// carry the description, keywords and pad count needed to actually choose.
//
// The first call against a cold cache reads every configured library and can take
// a while; KiCad persists an fp-info-cache afterwards, so later calls are fast.
//
// Returns SearchFootprintsResponse.
message SearchFootprints
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // Case-insensitive substring, matched against footprint name, description and
  // keywords. Empty returns everything, subject to max_results.
  string query = 2;

  // Restrict the search to these library nicknames. Empty searches all of them,
  // which is what makes a cold first call expensive.
  repeated string libraries = 3;

  // Cap on returned entries. 0 means the server default.
  uint32 max_results = 4;

  // Require every whitespace-separated term in `query` to match, rather than the
  // string as a whole. "0603 resistor" finds R_0603 this way; as one substring it
  // matches nothing.
  bool match_all_terms = 5;
}

message FootprintSearchResult
{
  kiapi.common.types.LibraryIdentifier id = 1;
  string description = 2;
  string keywords = 3;

  // Unique pad count -- the cheapest way to sanity-check a footprint against a
  // symbol before committing to it.
  uint32 pad_count = 4;
}

message SearchFootprintsResponse
{
  repeated FootprintSearchResult results = 1;

  // True when max_results cut the list short, so a caller can tell "these are all
  // the matches" from "these are the first N".
  bool truncated = 2;

  // How many entries were considered, i.e. the size of the index searched.
  uint32 total_indexed = 3;

  // Libraries KiCad failed to read, with the reason. Reported rather than dropped:
  // a silently short result list looks the same as a correct one.
  repeated string errors = 4;
}
